<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <header>
        <a href="../index.html">&larr; Volver al inicio</a>
        <h1>Taller5: Calculadora</h1>
        <p>Calculadora</p>
    </header>

    <label for="operacion">Operación:</label>
    <select id="operacion">
        <option value="">Selecciona una operación</option>
        <option value="suma">Suma (+)</option>
        <option value="resta">Resta (−)</option>
        <option value="multiplicacion">Multiplicación (×)</option>
        <option value="division">División (÷)</option>
    </select>

    <main>
        <form id="formTaller5" novalidate>
            <label for="numero1">Numero1:</label>
            <input type="number" id="numero1">

            <label for="numero2">Numero2:</label>
            <input type="number" id="numero2">

            <div class="botones">
                <input type="submit" value="Calcular">
                <input type="reset" value="Limpiar">
            </div>
        </form>

        <!-- Aquí se mostrarán los mensajes de error y el resultado -->
        <p id="resultado" class="mensaje"></p>
    </main>

    <script src="../js/taller5.js"></script>
</body>
</html>
